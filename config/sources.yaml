# Khai báo nguồn dữ liệu cho từng workstream.
# Crawler đọc file này để biết crawl URL nào, lưu ra file gì.
#
# Mỗi workstream có 1 hoặc nhiều `sources`. Mỗi source:
#   name        : tên nguồn (ghi vào provenance)
#   url         : URL crawl
#   type        : csv | json | html  (gợi ý cách parser đọc)
#   raw_file    : tên file lưu trong output/<ws>/raw/
#   license     : giấy phép / điều khoản dùng lại (để tuân thủ)

ws1_airport:
  sources:
    - name: OpenFlights Airports Database
      url: https://raw.githubusercontent.com/jpatokal/openflights/master/data/airports.dat
      type: csv
      raw_file: airports.dat
      license: Open Database License (ODbL) - jpatokal/openflights
    # Nguồn số hành khách (passenger) cần crawl riêng, ví dụ:
    # - name: Wikipedia - Busiest airports by passenger traffic
    #   url: https://en.wikipedia.org/wiki/List_of_busiest_airports_by_passenger_traffic
    #   type: html
    #   raw_file: busiest_airports.html
    #   license: CC BY-SA (Wikipedia)

# ws2_urban:            # ví dụ workstream khu đô thị (chưa seed)
#   sources: []
